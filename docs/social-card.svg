    <text x="125" y="35" font-family="Arial, sans-serif" font-size="24" fill="white" text-anchor="middle">📊 完整可观测性</text>
    <text x="125" y="60" font-family="Arial, sans-serif" font-size="16" fill="rgba(255,255,255,0.8)" text-anchor="middle">Observability</text>
