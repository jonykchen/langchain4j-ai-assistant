  <circle cx="100" cy="100" r="200" fill="rgba(255,255,255,0.1)"/>
  <circle cx="1180" cy="540" r="150" fill="rgba(255,255,255,0.1)"/>
  
  <!-- Main content -->
  <text x="640" y="180" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="white" text-anchor="middle">🤖 LangChain4j AI Assistant</text>
  
