# Welcome New Contributors - 欢迎新贡献者
name: Welcome New Contributors

on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            👋 欢迎来到 LangChain4j AI Assistant！
            
            感谢你创建第一个 Issue！我们会尽快查看并回复。
            
            请确保：
            - ✅ Issue 描述清晰
            - ✅ 包含必要的复现步骤
            
            如果有任何问题，欢迎在 [Discussions](https://github.com/jonykchen/langchain4j-ai-assistant/discussions) 中讨论。
            
          pr-message: |
            🎉 感谢你的第一个 Pull Request！
            
            我们会尽快审核你的贡献。在此之前，请确保：
            - ✅ 代码遵循项目风格
            - ✅ 添加了必要的测试
            - ✅ 更新了相关文档
            
            如果需要帮助，请随时在 Discussion 中提问。
