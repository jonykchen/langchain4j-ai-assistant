name: CI

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main ]

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '20'

jobs:
  # ==================== 后端构建与测试 ====================
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Clean Maven cache to fix corrupted POMs
        run: |
          # GitHub Actions cache restores before this step runs
          # Remove the entire m2 repository to force fresh download
          rm -rf ~/.m2/repository
          echo "Maven cache cleaned"

      - name: Build with Maven
        run: mvn clean compile -DskipTests -U -Dspring.cloud.contract.skip=true

      - name: Run unit tests
        run: mvn test -Dtest="!*IntegrationTest,!ChatTest,!HealthTest,!*AIModelTest*" -Dspring.cloud.contract.skip=true
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY || 'test-key' }}

      # 集成测试需要完整基础设施（数据库、Redis、Nacos），暂时在 CI 中跳过
      # 本地开发环境可通过 mvn test -Dtest="*IntegrationTest" 运行

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-reports
          path: target/surefire-reports/
          retention-days: 7

      - name: Upload JaCoCo report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 7

  # ==================== 前端构建与测试 ====================
  frontend:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint check
        run: npm run lint --if-present

      - name: Type check
        run: npm run type-check --if-present

      - name: Build
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ==================== E2E 测试 ====================
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install --with-deps

      - name: Run E2E tests
        run: npx playwright test
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # ==================== 性能测试 ====================
  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: [backend]
    # Performance tests require full infrastructure (PostgreSQL, Redis, Nacos, etc.)
    # Skip in CI - run locally or in staging environment with full infrastructure
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && false

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Run Gatling tests
        run: |
          # Provide simulation number via stdin to avoid interactive prompt
          # 1 = ChatSimulation
          echo "1" | mvn gatling:test -DskipTests

      - name: Upload Gatling report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gatling-report
          path: target/gatling-results/
          retention-days: 7

  # ==================== AI 模型测试 ====================
  ai-model-tests:
    name: AI Model Tests
    runs-on: ubuntu-latest
    needs: [backend]
    if: github.event_name == 'push'
    # AI model tests require DASHSCOPE_API_KEY secret - allow failure if not configured
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Clean Maven cache to fix corrupted POMs
        run: |
          rm -rf ~/.m2/repository
          echo "Maven cache cleaned"

      - name: Check for API Key
        id: check-secret
        run: |
          if [ -z "${{ secrets.DASHSCOPE_API_KEY }}" ]; then
            echo "has_key=false" >> $GITHUB_OUTPUT
            echo "::warning::DASHSCOPE_API_KEY secret not configured, skipping AI model tests"
          else
            echo "has_key=true" >> $GITHUB_OUTPUT
          fi

      - name: Run AI model tests
        if: steps.check-secret.outputs.has_key == 'true'
        run: mvn test -Dtest="*AIModelTest*"
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          SPRING_PROFILES_ACTIVE: ai-test

      - name: Upload AI test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-model-test-report
          path: target/surefire-reports/
          retention-days: 7

  # ==================== Docker 镜像构建 ====================
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    # Docker build requires DOCKER_USERNAME and DOCKER_PASSWORD secrets - allow failure if not configured
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check for Docker credentials
        id: check-docker
        run: |
          if [ -z "${{ secrets.DOCKER_USERNAME }}" ] || [ -z "${{ secrets.DOCKER_PASSWORD }}" ]; then
            echo "has_creds=false" >> $GITHUB_OUTPUT
            echo "::warning::Docker credentials not configured, skipping Docker build"
          else
            echo "has_creds=true" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        if: steps.check-docker.outputs.has_creds == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: steps.check-docker.outputs.has_creds == 'true' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        if: steps.check-docker.outputs.has_creds == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/langchain4j-chat
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}

      - name: Build and push backend image
        if: steps.check-docker.outputs.has_creds == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend.Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}-backend
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        if: steps.check-docker.outputs.has_creds == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: frontend.Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}-frontend
          cache-from: type=gha
          cache-to: type=gha,mode=max
