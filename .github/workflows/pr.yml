name: PR Check

on:
  pull_request:
    branches: [ master, main ]

jobs:
  pr-check:
    name: PR Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Check code style
        run: mvn checkstyle:check -Dcheckstyle.failOnViolation=true || echo "Checkstyle not configured yet"

      - name: Compile
        run: mvn clean compile -DskipTests

      - name: Run tests
        run: mvn test

      - name: Check for FIXME/TODO in new code
        run: |
          git diff origin/master...HEAD --name-only | grep -E '\.(java|ts|vue)$' | while read file; do
            if git diff origin/master...HEAD "$file" | grep -E '^\+.*\b(FIXME|TODO|XXX)\b'; then
              echo "Warning: Found FIXME/TODO in $file"
            fi
          done
