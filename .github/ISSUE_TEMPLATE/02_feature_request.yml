name: 💡 功能请求
description: 提出新功能建议
title: "[FEATURE] "
labels: ["enhancement", "needs-triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议！请详细描述你想要的功能。
        
  - type: textarea
    id: problem
    attributes:
      label: 问题背景
      description: 这个功能要解决什么问题？
      placeholder: "作为一个用户，我希望能够..."
    validations:
      required: true
      
  - type: textarea
    id: solution
    attributes:
      label: 建议方案
      description: 描述你建议的解决方案
    validations:
      required: true
      
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你考虑过哪些其他方案？
    validations:
      required: false
      
  - type: dropdown
    id: area
    attributes:
      label: 功能领域
      multiple: true
      options:
        - 后端 API
        - 前端界面
        - AI 模型
        - Agent 系统
        - 文档
        - 其他
    validations:
      required: true
      
  - type: dropdown
    id: priority
    attributes:
      label: 优先级
      options:
        - 低 - 锦上添花
        - 中 - 改善体验
        - 高 - 严重影响使用
    validations:
      required: true
      
  - type: checkboxes
    id: terms
    attributes:
      label: 确认
      options:
        - label: 我已搜索现有 Issues，确认没有重复建议
          required: true
        - label: 我愿意提交 PR 实现这个功能
          required: false
