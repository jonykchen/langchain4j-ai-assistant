name: 🐛 Bug 报告
description: 报告一个 Bug 帮助我们改进
title: "[BUG] "
labels: ["bug", "needs-triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        感谢你花时间报告这个问题！请填写以下信息。
        
  - type: textarea
    id: description
    attributes:
      label: Bug 描述
      description: 请清晰简洁地描述遇到的问题
      placeholder: "当我执行...时，发生了..."
    validations:
      required: true
      
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 详细描述如何复现这个问题
      value: |
        1. 执行 '...'
        2. 点击 '...'
        3. 滚动到 '...'
        4. 看到错误
    validations:
      required: true
      
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 描述你期望发生的情况
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 描述实际发生的情况
    validations:
      required: true
      
  - type: dropdown
    id: area
    attributes:
      label: 问题领域
      multiple: true
      options:
        - 后端 API
        - 前端界面
        - AI 模型
        - Docker 部署
        - 文档
        - 其他
    validations:
      required: true
      
  - type: textarea
    id: environment
    attributes:
      label: 环境信息
      description: 请提供环境信息
      value: |
        - OS: [如 macOS 14, Windows 11, Ubuntu 22.04]
        - 浏览器: [如 Chrome 120]
        - Java 版本: [如 17]
        - Node.js 版本: [如 20]
    validations:
      required: false
      
  - type: textarea
    id: logs
    attributes:
      label: 日志信息
      description: 请粘贴相关日志（移除敏感信息）
      render: shell
    validations:
      required: false
      
  - type: checkboxes
    id: terms
    attributes:
      label: 确认
      options:
        - label: 我已搜索现有 Issues，确认没有重复报告
          required: true
        - label: 我已阅读 README 和文档
          required: true
