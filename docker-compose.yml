services:
  # ==================== 数据库服务 ====================

  # PostgreSQL with pgvector - 主数据库
  postgres:
    image: pgvector/pgvector:pg16
    container_name: langchain4j-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-langchain4j}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/main/resources/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - langchain4j-network
    restart: unless-stopped

  # ==================== 应用服务 ====================

  # 后端服务 - Spring Boot 应用
  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    container_name: langchain4j-backend
    ports:
      - "8082:8082"
    environment:
      - SPRING_APPLICATION_NAME=LangChain4j-Chat
      - SERVER_PORT=8082
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
      # 数据库配置
      - DATABASE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-langchain4j}
      - DATABASE_USERNAME=${POSTGRES_USER:-postgres}
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      # API Key
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:?DASHSCOPE_API_KEY is required}
      # OAuth 配置
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      # Redis 配置
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # Nacos 配置
      - NACOS_SERVER_ADDR=nacos:8848
      - NACOS_NAMESPACE=prod
      - NACOS_GROUP=DEFAULT_GROUP
      - NACOS_DATA_ID=langchain4j-chat.properties
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
      zipkin:
        condition: service_started
    networks:
      - langchain4j-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # 前端服务 - Vue 应用
  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    container_name: langchain4j-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - langchain4j-network
    restart: unless-stopped

  # ==================== 基础设施服务 ====================

  # Redis - 分布式限流与缓存
  redis:
    image: docker.1ms.run/redis:7-alpine
    container_name: langchain4j-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - langchain4j-network
    restart: unless-stopped

  # Nacos 数据库（MySQL）
  nacos-db:
    image: docker.1ms.run/mysql:8.0
    container_name: langchain4j-nacos-db
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-REDACTED_ROOT_PASSWORD}
      MYSQL_DATABASE: nacos
      MYSQL_USER: ${NACOS_DB_USER:-nacos}
      MYSQL_PASSWORD: ${NACOS_DB_PASSWORD:-REDACTED_NACOS_PASSWORD}
    volumes:
      - nacos_db_data:/var/lib/mysql
      - ./infra/mysql/conf/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      - ./infra/nacos/init/01-nacos-init.sql:/docker-entrypoint-initdb.d/01-nacos-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-REDACTED_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - langchain4j-network
    restart: unless-stopped

  # Nacos 配置中心
  nacos:
    image: docker.1ms.run/nacos/nacos-server:v2.3.1
    container_name: langchain4j-nacos
    ports:
      - "8848:8848"
      - "9848:9848"
    environment:
      - MODE=standalone
      - PREFER_HOST_MODE=hostname
      - JVM_XMS=256m
      - JVM_XMX=512m
      - SPRING_DATASOURCE_PLATFORM=mysql
      - MYSQL_SERVICE_HOST=nacos-db
      - MYSQL_SERVICE_PORT=3306
      - MYSQL_SERVICE_DB_NAME=nacos
      - MYSQL_SERVICE_USER=${NACOS_DB_USER:-nacos}
      - MYSQL_SERVICE_PASSWORD=${NACOS_DB_PASSWORD:-REDACTED_NACOS_PASSWORD}
      - MYSQL_SERVICE_DB_PARAM=characterEncoding=utf8&connectTimeout=10000&socketTimeout=30000&autoReconnect=true&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    volumes:
      - nacos_logs:/home/nacos/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/v1/console/health/readiness"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      nacos-db:
        condition: service_healthy
    networks:
      - langchain4j-network
    restart: unless-stopped

  # Zipkin 链路追踪
  zipkin:
    image: docker.1ms.run/openzipkin/zipkin:latest
    container_name: langchain4j-zipkin
    ports:
      - "9411:9411"
    networks:
      - langchain4j-network
    restart: unless-stopped

  # ==================== 监控服务 ====================

  # Prometheus - 指标收集
  prometheus:
    image: docker.1ms.run/prom/prometheus:v2.48.0
    container_name: langchain4j-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    depends_on:
      - backend
    networks:
      - langchain4j-network
    restart: unless-stopped

  # Grafana - 可视化面板
  grafana:
    image: docker.1ms.run/grafana/grafana:10.2.0
    container_name: langchain4j-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=REDACTED_ADMIN_PASSWORD
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - langchain4j-network
    restart: unless-stopped

# ==================== 数据卷 ====================
volumes:
  postgres_data:
  redis_data:
  nacos_logs:
  nacos_db_data:
  prometheus_data:
  grafana_data:

# ==================== 网络 ====================
networks:
  langchain4j-network:
    driver: bridge