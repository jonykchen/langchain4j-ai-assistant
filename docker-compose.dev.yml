# ==================== 本地开发环境配置 ====================
#
# 用途：搭建开发所需的依赖服务（Redis、Nacos 等）
# 前后端代码由开发者自己启动，不打包为镜像
#
# 启动方式：
#   docker compose -f docker-compose.dev.yml up -d
#
# 停止方式：
#   docker compose -f docker-compose.dev.yml down
#
# 查看日志：
#   docker compose -f docker-compose.dev.yml logs -f

services:
  # ==================== Redis - 分布式限流与缓存 ====================
  redis:
    image: docker.1ms.run/redis:7-alpine
    container_name: langchain4j-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - langchain4j-network
    restart: unless-stopped

  # ==================== Nacos 配置中心 ====================
  nacos:
    image: docker.1ms.run/nacos/nacos-server:v2.3.1
    container_name: langchain4j-nacos
    ports:
      - "8848:8848"
      - "9848:9848"
    environment:
      - MODE=standalone
      - PREFER_HOST_MODE=hostname
      - JVM_XMS=256m
      - JVM_XMX=512m
    volumes:
      - nacos_logs:/home/nacos/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/v1/console/health/readiness"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - langchain4j-network
    restart: unless-stopped

  # ==================== Zipkin 链路追踪 ====================
  zipkin:
    image: docker.1ms.run/openzipkin/zipkin:latest
    container_name: langchain4j-zipkin
    ports:
      - "9411:9411"
    networks:
      - langchain4j-network
    restart: unless-stopped

  # ==================== Prometheus - 指标收集 ====================
  prometheus:
    image: docker.1ms.run/prom/prometheus:v2.48.0
    container_name: langchain4j-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    networks:
      - langchain4j-network
    restart: unless-stopped

  # ==================== Grafana - 可视化面板 ====================
  grafana:
    image: docker.1ms.run/grafana/grafana:10.2.0
    container_name: langchain4j-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=REDACTED_ADMIN_PASSWORD
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - langchain4j-network
    restart: unless-stopped

# ==================== 数据卷 ====================
volumes:
  redis_data:
  nacos_logs:
  prometheus_data:
  grafana_data:

# ==================== 网络 ====================
networks:
  langchain4j-network:
    driver: bridge
