gatling {
  core {
    # 输出目录配置
    directory {
      simulations = src/test/scala/gatling/simulations
      resources = src/test/resources
      results = target/gatling-results
    }
    # 编码
    encoding = UTF-8
    # 模拟类（可覆盖）
    simulationClass = ""
    # 是否生成报告
    generateReports = true
  }

  http {
    # HTTP 缓存配置
    fetchedCssCacheMaxCapacity = 200
    fetchedHtmlCacheMaxCapacity = 200
    fetchedJsCacheMaxCapacity = 200
    fetchedJsCssCacheMaxCapacity = 200
  }

  charting {
    # 报告配置
    noReports = false
    maxPlotPerSeries = 1000
    useGroupLongChartName = false
  }

  # 默认的断言配置
  assertion {
    # 默认超时时间
    timeout = 30
  }
}
