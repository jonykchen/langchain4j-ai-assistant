# AI 模型测试配置

# 随机端口
server.port=0

# 禁用 Redis（AI 测试不需要）
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

# 禁用 Nacos
nacos.config.enabled=false
nacos.discovery.enabled=false

# 启用所有模型用于测试
model.providers.dashscope.enabled=true
model.providers.zhipu.enabled=true
model.providers.deepseek.enabled=true

# 测试环境日志级别
logging.level.com.jonychen=DEBUG
logging.level.dev.langchain4j=INFO

# 宽松的限流配置
resilience4j.ratelimiters.instances.chat.limitForPeriod=1000
resilience4j.ratelimiters.instances.chat.limitRefreshPeriod=1m
resilience4j.ratelimiters.instances.chat.timeoutDuration=0

# 宽松的熔断配置
resilience4j.circuitbreaker.instances.chat.slidingWindowSize=100
resilience4j.circuitbreaker.instances.chat.failureRateThreshold=80
resilience4j.circuitbreaker.instances.chat.waitDurationInOpenState=5s
