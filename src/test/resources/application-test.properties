# ==================== 测试环境配置 ====================

server.port=0

# LangChain4j 模型配置
langchain4j.open-ai.chat-model.api-key=test-api-key
langchain4j.open-ai.chat-model.base-url=https://dashscope.aliyuncs.com/compatible-mode/v1
langchain4j.open-ai.chat-model.model-name=qwen-plus

langchain4j.open-ai.streaming-chat-model.api-key=test-api-key
langchain4j.open-ai.streaming-chat-model.base-url=https://dashscope.aliyuncs.com/compatible-mode/v1
langchain4j.open-ai.streaming-chat-model.model-name=qwen-plus

# Redis 配置（测试环境使用内联模拟）
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Nacos 配置（测试环境禁用）
nacos.config.enabled=false
nacos.discovery.enabled=false

# 日志配置
logging.level.dev.langchain4j=WARN
logging.level.com.jonychen=DEBUG
logging.level.io.github.resilience4j=DEBUG

# 监控端点
management.endpoints.web.exposure.include=health

# Resilience4j 测试配置
resilience4j.ratelimiters.instances.chat.limitForPeriod=1000
resilience4j.ratelimiters.instances.chat.limitRefreshPeriod=1m
resilience4j.ratelimiters.instances.chat.timeoutDuration=0

resilience4j.ratelimiters.instances.chatStream.limitForPeriod=1000
resilience4j.ratelimiters.instances.chatStream.limitRefreshPeriod=1m
resilience4j.ratelimiters.instances.chatStream.timeoutDuration=0

resilience4j.circuitbreaker.instances.chat.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.chat.slidingWindowSize=10
resilience4j.circuitbreaker.instances.chat.failureRateThreshold=50
resilience4j.circuitbreaker.instances.chat.waitDurationInOpenState=5s
resilience4j.circuitbreaker.instances.chat.permittedNumberOfCallsInHalfOpenState=3

resilience4j.retry.instances.chat.maxAttempts=1