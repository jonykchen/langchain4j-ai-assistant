# ==================== 应用本地配置 ====================
#
# 本文件仅保留实例特定的本地配置
#
# Nacos 配置文件：
# - langchain4j-chat.properties：公共配置（数据库、模型、安全、监控等）
# - langchain4j-chat-dev.properties：开发环境配置
# - langchain4j-chat-prod.properties：生产环境配置
# - common.properties：跨应用共享配置
#

# ==================== 服务器配置 ====================
# 服务端口（可按实例独立配置）
server.port=${SERVER_PORT:8082}

# ==================== 应用名称和 Profile ====================
spring.application.name=langchain4j-chat
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ==================== Nacos 配置导入（Spring Cloud 2024.x 推荐方式）====================
# 使用 spring.config.import 方式加载 Nacos 配置，替代传统的 bootstrap.yml 方式
spring.config.import=optional:nacos:langchain4j-chat.properties,\
  optional:nacos:common.properties

# Nacos 服务器地址
spring.cloud.nacos.config.server-addr=${NACOS_SERVER_ADDR:localhost:8848}
spring.cloud.nacos.config.namespace=dev
spring.cloud.nacos.config.group=DEFAULT_GROUP
spring.cloud.nacos.config.refresh-enabled=true

# ==================== 环境变量外部化说明 ====================
#
# 敏感配置通过环境变量注入，格式：${ENV_VAR:default_value}
#
# 必需的环境变量：
# - DASHSCOPE_API_KEY: 阿里云 DashScope API Key（主模型）
#
# 可选的环境变量：
# - SERVER_PORT: 服务端口（默认 8082）
# - SPRING_PROFILES_ACTIVE: 激活环境（dev/prod，默认 dev）
# - NACOS_SERVER_ADDR: Nacos 地址（默认 localhost:8848）
# - NACOS_NAMESPACE: Nacos 命名空间（默认 dev）
# - DATABASE_URL: 数据库连接 URL
# - DATABASE_USERNAME: 数据库用户名
# - DATABASE_PASSWORD: 数据库密码
# - JWT_SECRET: JWT 密钥
# - GITHUB_CLIENT_ID/GITHUB_CLIENT_SECRET: GitHub OAuth
# - GITLAB_CLIENT_ID/GITLAB_CLIENT_SECRET: GitLab OAuth
# - REDIS_HOST/REDIS_PORT: Redis 连接信息
#
# 使用方式：
# 1. 复制 .env.example 为 .env 并填入实际值
# 2. 或在启动时设置环境变量：
#    DASHSCOPE_API_KEY=your-key mvn spring-boot:run
# 3. 或在 IDE 中配置环境变量
