# ==================== 应用基础配置 ====================

# 应用名称
spring.application.name=LangChain4j Spring Boot Example

# 服务器端口
server.port=8082

# 激活的环境配置（通过环境变量覆盖：SPRING_PROFILES_ACTIVE=prod）
spring.profiles.active=dev

# ==================== 环境变量外部化说明 ====================
#
# 敏感配置通过环境变量注入，格式：${ENV_VAR:default_value}
#
# 必需的环境变量：
# - DASHSCOPE_API_KEY: 阿里云 DashScope API Key
#
# 可选的环境变量：
# - SERVER_PORT: 服务端口（默认 8082）
# - LOG_LEVEL_LANGCHAIN4J: LangChain4j 日志级别（默认 DEBUG）
#
# 使用方式：
# 1. 复制 .env.example 为 .env 并填入实际值
# 2. 或在启动时设置环境变量：
#    DASHSCOPE_API_KEY=your-key mvn spring-boot:run
# 3. 或在 IDE 中配置环境变量

# ==================== 数据库配置 ====================
# 开发环境使用 H2，生产环境使用 PostgreSQL
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:langchain4j;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.h2.Driver}

# JPA 配置
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# H2 控制台（仅开发环境）
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

# ==================== JWT 认证配置 ====================
jwt.secret=${JWT_SECRET:REDACTED_JWT_SECRET}
jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:3600}
jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION:604800}

# ==================== OAuth 配置 ====================
# GitHub OAuth
oauth.github.client-id=${GITHUB_CLIENT_ID:}
oauth.github.client-secret=${GITHUB_CLIENT_SECRET:}

# GitLab OAuth
oauth.gitlab.client-id=${GITLAB_CLIENT_ID:}
oauth.gitlab.client-secret=${GITLAB_CLIENT_SECRET:}
oauth.gitlab.url=${GITLAB_URL:https://gitlab.com}

# ==================== 安全配置 ====================
# 启用方法级安全注解
spring.security.user.name=admin
spring.security.user.password=admin
spring.security.user.roles=ADMIN