# ==================== 应用基础配置 ====================

# 应用名称，显示在日志和监控中
spring.application.name=LangChain4j Spring Boot Example

# 服务器端口
# 默认 8080，这里改为 8082 避免与前端 3000 端口混淆
server.port=8082

# ==================== LangChain4j 模型配置 ====================
#
# LangChain4j 支持多种 LLM 提供商：
# - OpenAI (官方 API)
# - Azure OpenAI
# - 阿里云 DashScope (通义千问)
# - 智谱 AI (GLM)
# - 百度千帆
# - 本地模型 (Ollama, LocalAI)
#
# 配置前缀说明：
# - langchain4j.open-ai.*     → 使用 OpenAI 兼容 API
# - langchain4j.azure-open-ai.* → Azure OpenAI
# - langchain4j.zhipu-ai.*    → 智谱 AI
#
# 本项目使用阿里云 DashScope 的 OpenAI 兼容模式
# 文档：https://help.aliyun.com/zh/model-studio/developer-reference/use-qwen-by-calling-api

# ---------- 同步聊天模型配置 ----------
# 用于 ChatAssistant.chat() 方法

# API 密钥
# 获取方式：阿里云控制台 → 模型服务灵积 → API-KEY 管理
langchain4j.open-ai.chat-model.api-key=sk-7a5a4473f7794045ab763962402e608e

# API 基础 URL
# DashScope 的 OpenAI 兼容端点
langchain4j.open-ai.chat-model.base-url=https://dashscope.aliyuncs.com/compatible-mode/v1

# 模型名称
# 可选模型：qwen-turbo, qwen-plus, qwen-max, qwen-max-longcontext
# - qwen-turbo: 速度快，成本低，适合简单任务
# - qwen-plus: 平衡性能和成本，推荐使用
# - qwen-max: 最强能力，适合复杂任务
langchain4j.open-ai.chat-model.model-name=qwen-plus

# 其他可选参数（未配置时使用默认值）：
# langchain4j.open-ai.chat-model.temperature=0.7      # 创造性 0-2
# langchain4j.open-ai.chat-model.max-tokens=4096      # 最大输出长度
# langchain4j.open-ai.chat-model.top-p=0.9            # 核采样
# langchain4j.open-ai.chat-model.timeout=60s          # 请求超时

# ---------- 流式聊天模型配置 ----------
# 用于 ChatAssistant.chatFlux() 方法

langchain4j.open-ai.streaming-chat-model.api-key=sk-7a5a4473f7794045ab763962402e608e
langchain4j.open-ai.streaming-chat-model.base-url=https://dashscope.aliyuncs.com/compatible-mode/v1
langchain4j.open-ai.streaming-chat-model.model-name=qwen-plus

# ==================== 日志配置 ====================

# LangChain4j 调试日志
# DEBUG 级别可以看到完整的请求/响应内容
# 生产环境建议改为 INFO 或 WARN
logging.level.dev.langchain4j=DEBUG

# ==================== 监控配置 ====================

# 暴露所有 Actuator 端点
# 访问 http://localhost:8082/actuator 查看可用端点
management.endpoints.web.exposure.include=*

# 链路追踪采样率
# 1.0 = 100% 采样，生产环境建议降低
# 需要 Zipkin/Jaeger 服务端，没有运行时会报连接错误
management.tracing.sampling.probability=1

# ==================== 其他常用配置 ====================

# 连接池配置（高并发时需要）
# spring.http.client.connect-timeout=10s
# spring.http.client.read-timeout=60s

# JSON 配置
# spring.jackson.default-property-inclusion=non_null
# spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

# 文件上传限制
# spring.servlet.multipart.max-file-size=10MB
# spring.servlet.multipart.max-request-size=10MB

# ==================== 环境隔离配置示例 ====================
#
# 开发环境：application-dev.properties
# 生产环境：application-prod.properties
#
# 激活方式：spring.profiles.active=dev
#
# 敏感配置建议：
# 1. 使用环境变量：API_KEY=${DASHSCOPE_API_KEY}
# 2. 使用 Spring Cloud Config / Nacos
# 3. 使用 Vault 等密钥管理服务
