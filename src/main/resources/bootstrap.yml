# ==================== Spring Cloud Bootstrap 配置 ====================
#
# 此文件在 application.yml/properties 之前加载，用于配置 Nacos 连接
# Spring Cloud Alibaba Nacos 从 Nacos 服务器加载应用配置
#

spring:
  application:
    # 应用名称，用于 Nacos 配置的 Data ID 前缀
    name: langchain4j-chat
  profiles:
    # 激活的环境配置（dev/prod）
    active: ${SPRING_PROFILES_ACTIVE:dev}
  cloud:
    nacos:
      # ==================== Nacos 配置中心 ====================
      config:
        # Nacos 服务器地址
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        # 命名空间（用于环境隔离，默认 public）
        namespace: ${NACOS_NAMESPACE:}
        # 配置分组
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        # 配置文件格式
        file-extension: properties
        # 是否启用配置自动刷新
        refresh-enabled: true
        # 扩展配置（共享配置）
        shared-configs:
          - data-id: common.properties
            group: DEFAULT_GROUP
            refresh: true

      # ==================== Nacos 服务发现 ====================
      discovery:
        # Nacos 服务器地址
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        # 命名空间
        namespace: ${NACOS_NAMESPACE:}
        # 是否启用服务注册（默认禁用）
        enabled: ${NACOS_DISCOVERY_ENABLED:false}
