# ==================== Nacos 初始化配置 ====================
#
# 此文件会在 Nacos 启动时自动加载
#

# ==================== 服务端配置 ====================
server.port=8848

# ==================== 数据持久化配置 ====================
# 单机模式使用内置存储
spring.datasource.platform=embedded

# ==================== 日志级别 ====================
logging.level.com.alibaba.nacos=INFO
