# ==================== Nacos 配置示例 ====================
#
# 在 Nacos 控制台创建配置：
# - Data ID: langchain4j-chat.properties
# - Group: DEFAULT_GROUP
# - 配置内容如下：
#
# 完整配置参考：infra/nacos/config/ 目录下的文件
#

# ==================== 数据库配置（PostgreSQL） ====================
# P6Spy 包装：输出完整可执行 SQL
spring.datasource.url=jdbc:p6spy:postgresql://localhost:5432/langchain4j?currentSchema=public
spring.datasource.username=langchain4j
spring.datasource.password=REDACTED_DB_PASSWORD
spring.datasource.driver-class-name=com.p6spy.engine.spy.P6SpyDriver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==================== 限流配置（动态更新） ====================
rate.limit.chat.limit=20
rate.limit.chat.period=60
rate.limit.chatStream.limit=30
rate.limit.chatStream.period=60

# ==================== Resilience4j 熔断器配置 ====================
resilience4j.circuitbreaker.instances.chat.slidingWindowSize=20
resilience4j.circuitbreaker.instances.chat.failureRateThreshold=30
resilience4j.circuitbreaker.instances.chat.waitDurationInOpenState=30s

# ==================== LangChain4j 模型配置 ====================
langchain4j.open-ai.chat-model.model-name=qwen-plus
langchain4j.open-ai.chat-model.temperature=0.7
langchain4j.open-ai.chat-model.max-tokens=4096
